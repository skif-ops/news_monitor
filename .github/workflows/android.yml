name: Сборка APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Найти папку проекта
        id: locate
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path '*/build/*' | head -1)
          if [ -z "$FILE" ]; then
            echo "::error::Файл settings.gradle.kts не найден — файлы проекта не загружены."
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Проект найден в: $DIR"

      - name: Подготовить ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Не задан секрет KEYSTORE_BASE64. Добавьте секреты в Settings -> Secrets and variables -> Actions (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          echo "Ключ подписи подготовлен."

      - name: Сборка подписанного APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace
        working-directory: ${{ steps.locate.outputs.dir }}

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: news-monitor-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/release/*.apk
